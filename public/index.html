<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LaHaze Marketing HQ</title>
<meta name="description" content="Every LaHaze marketing project, decision, request and vendor thread in one place.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600;700&family=DM+Serif+Display:ital@0;1&display=swap">
<style>
/* One quiet off-white sheet. Hairlines and whitespace separate sections, ink carries the hierarchy,
   and color appears only as small status dots. */
:root{
  --bg:#FAF9F6; --surface:#FFFFFF; --ink:#101A2B; --muted:#6B7280; --line:#E6E3DC;
  --accent:#14804F; --accent-ink:#FFFFFF;
  --ok:#14804F; --info:#2B5EA6; --warn:#A8650A; --bad:#B23A2E; --mute:#9AA0AB; --teal:#0F7C86;
  --display:"DM Serif Display",Georgia,"Times New Roman",serif;
  --body:"Albert Sans",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

.band{background:var(--bg);color:var(--ink)}
.band .wrap{padding-block:40px 0;display:flex;flex-direction:column;gap:10px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.band h1{font-family:var(--display);font-weight:400;font-size:clamp(28px,4vw,36px);line-height:1.1;text-wrap:balance}
.brief{color:var(--muted);max-width:68ch;font-size:15px}
.brief b{color:var(--ink);font-weight:600}
.tabs{display:flex;gap:22px;overflow-x:auto;margin-top:18px;scrollbar-width:none;border-bottom:1px solid var(--line)}
.tabs a{color:var(--muted);text-decoration:none;padding:10px 0;font-weight:500;font-size:14px;white-space:nowrap;border-bottom:1px solid transparent;margin-bottom:-1px;display:flex;gap:7px;align-items:center}
.tabs a:hover{color:var(--ink)}
.tabs a[aria-current="page"]{color:var(--ink);font-weight:600;border-bottom-color:var(--ink)}
.count{font-size:12px;font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums}

main.wrap{padding-block:36px 64px;display:flex;flex-direction:column;gap:32px}
.notice{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:10px 0;color:var(--muted)}

.head{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:baseline;justify-content:space-between}
.head h2{font-family:var(--display);font-weight:400;font-size:22px;line-height:1.2}
.head p{color:var(--muted);max-width:60ch}
.head > div{min-width:0;display:flex;flex-direction:column;gap:2px}
.btn{background:var(--ink);color:var(--bg);border:1px solid var(--ink);border-radius:4px;padding:7px 14px;font-weight:500;font-size:14px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.btn.sm{padding:3px 9px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:default}
.linkbtn{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:13px}

.statusbar{display:flex;flex-direction:column;gap:10px}
.bar{display:flex;gap:2px;height:4px;overflow:hidden}
.bar span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend b{color:var(--ink);font-variant-numeric:tabular-nums}
.sw{width:7px;height:7px;border-radius:50%;display:inline-block;flex:none}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:40px 48px}
@media (max-width:760px){.grid{grid-template-columns:minmax(0,1fr)}}
.panel{border-top:1px solid var(--ink);padding-top:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.panel h3{font-family:var(--display);font-weight:400;font-size:19px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.panel h3 a{font-family:var(--body);font-size:13px;font-weight:500;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.panel .q{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:var(--muted)}
.empty{color:var(--muted);font-size:14px;padding:4px 0}

.list{display:flex;flex-direction:column}
.row{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.list > .row:first-child{border-top:0}
.row .main{flex:1 1 260px;min-width:0;display:flex;flex-direction:column;gap:2px}
.row .t{font-weight:500;overflow-wrap:anywhere}
.row .t a{color:inherit}
.row .s{color:var(--muted);font-size:13.5px;overflow-wrap:anywhere}
.row .side{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;font-size:13px;color:var(--muted)}
.when{font-variant-numeric:tabular-nums;white-space:nowrap}
.when.late{color:var(--bad);font-weight:600}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;color:var(--ink);white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c,var(--mute))}
.pill.unset{color:var(--muted);font-weight:400}
.pill.unset::before{background:transparent;border:1px solid var(--mute)}
.tag{font-size:12px;color:var(--muted);white-space:nowrap}
.tag:not(:last-child)::after{content:" ·"}
.group{display:flex;flex-direction:column;gap:2px}
.group > h3{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:var(--muted);padding-bottom:8px;border-bottom:1px solid var(--ink)}
.filters{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.chip{border:0;background:transparent;padding:4px 0;font-size:13px;font-weight:500;cursor:pointer;color:var(--muted)}
.chip[aria-pressed="true"]{color:var(--ink);font-weight:600;text-decoration:underline;text-underline-offset:5px}
select.f{border:1px solid var(--line);background:transparent;border-radius:4px;padding:4px 8px;font-size:13px;color:var(--muted)}

.board{display:flex;gap:20px;overflow-x:auto;padding-bottom:12px;align-items:flex-start}
.col{flex:1 0 150px;min-width:0;display:flex;flex-direction:column;gap:8px;min-height:140px}
.col.over{outline:1px dashed var(--muted);outline-offset:6px}
.col h3{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:8px;padding-bottom:8px;border-bottom:1px solid var(--ink);margin-bottom:4px}
.col h3 b{margin-left:auto;color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:10px 12px;display:flex;flex-direction:column;gap:5px}
.card[draggable="true"]{cursor:grab}
.card[draggable="true"]:hover{border-color:var(--ink)}
.card.drag{opacity:.4}
.card .t{font-weight:500;font-size:14px;line-height:1.35;overflow-wrap:anywhere}
.card .s{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.card .m{display:flex;flex-wrap:wrap;gap:2px 5px;align-items:center;font-size:12.5px;color:var(--muted)}
.colempty{color:var(--mute);font-size:13px;padding:6px 0}
.money{display:flex;flex-direction:column;gap:4px}
.money .lab{display:flex;justify-content:space-between;gap:12px;font-size:13.5px}
.money .lab span:last-child{font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.track{height:3px;background:var(--line);overflow:hidden}
.track span{display:block;height:100%;background:var(--ink)}
.track span.over{background:var(--bad)}
.big{font-family:var(--display);font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.big small{font-family:var(--body);font-size:13.5px;color:var(--muted)}

dialog{border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);padding:0;width:min(560px,calc(100vw - 32px));max-height:calc(100dvh - 40px)}
dialog::backdrop{background:rgba(16,26,43,.35)}
dialog form{display:flex;flex-direction:column;gap:14px;padding:20px}
dialog h2{font-family:var(--display);font-weight:400;font-size:22px}
dialog p.sub{color:var(--muted);font-size:14px}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld.wide{grid-column:1/-1}
@media (max-width:480px){.fld{grid-column:1/-1}}
.fld label{font-size:12.5px;font-weight:500;color:var(--muted)}
.fld input,.fld select,.fld textarea{border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:8px 10px;width:100%}
.fld textarea{min-height:76px;resize:vertical}
.actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;align-items:center}
.actions .sp{flex:1}
.err{color:var(--bad);font-size:13.5px}
footer.wrap{padding-block:0 84px;color:var(--muted);font-size:13px;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline}

/* project assistant */
.ask-btn{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));z-index:20;background:var(--ink);color:var(--bg);border:0;border-radius:999px;padding:11px 18px;font-weight:500;font-size:14px;cursor:pointer;box-shadow:0 2px 10px rgba(16,26,43,.18)}
.chat{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));z-index:21;width:min(400px,calc(100vw - 32px));height:min(560px,calc(100dvh - 32px));background:var(--bg);border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 30px rgba(16,26,43,.16);display:flex;flex-direction:column;overflow:hidden}
.chat header{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.chat header h2{font-family:var(--display);font-weight:400;font-size:19px}
.chat header button{background:none;border:0;color:var(--muted);font-size:13px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.chat .log{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:88%;font-size:14px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--ink);color:var(--bg);padding:8px 12px;border-radius:12px 12px 2px 12px}
.msg.bot{align-self:flex-start;color:var(--ink)}
.msg.bot.dim{color:var(--muted)}
.chat .hint{display:flex;flex-wrap:wrap;gap:6px}
.chat .hint button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:12.5px;color:var(--muted);cursor:pointer}
.chat .hint button:hover{color:var(--ink);border-color:var(--ink)}
.chat form{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line)}
.chat textarea{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:8px 10px;resize:none;height:40px;max-height:120px;font-size:14px}
.chat .note{font-size:11.5px;color:var(--muted);padding:0 16px 10px}
</style>
</head>
<body>
<header class="band">
  <div class="wrap">
    <p class="eyebrow">Newity · LaHaze · Marketing</p>
    <h1>Marketing <i>HQ</i></h1>
    <p class="brief" id="brief">Every marketing project, decision, request and vendor thread across Cheboygan, Traverse City and Alpena, in one place.</p>
    <nav class="tabs" id="tabs" aria-label="Sections"></nav>
  </div>
</header>

<main class="wrap" id="app"></main>
<footer class="wrap" id="foot"></footer>

<dialog id="dlg"><form id="frm" novalidate></form></dialog>

<button class="ask-btn" id="ask-open" hidden>Ask about a project</button>
<section class="chat" id="chat" hidden aria-label="Project assistant">
  <header><h2>Ask Marketing HQ</h2><button type="button" id="ask-close">Close</button></header>
  <div class="log" id="ask-log" aria-live="polite"></div>
  <form id="ask-form"><textarea id="ask-in" rows="1" placeholder="Ask about any project…" aria-label="Your question" maxlength="1500"></textarea><button class="btn" id="ask-send">Ask</button></form>
  <p class="note">Answers come from the board and can be wrong. The assistant can't change anything.</p>
</section>

<script src="/app.js"></script>
<script src="/chat.js"></script>
</body>
</html>
